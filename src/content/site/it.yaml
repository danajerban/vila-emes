    read_all_reviews_url: "https://www.booking.com/hotel/al/vila-emes.html#tab-reviews"
  rooms:
    eyebrow: "Soggiorno"
    heading: "Le nostre camere"
    intro: "11 tipologie in totale, da una matrimoniale di 30 m² a un appartamento di 90 m² con vista mare."
    preview_card_cta: "Vedi i dettagli →"
  gallery:
    eyebrow: "Dentro e fuori"
    heading: "Sei inquadrature"
    intro: "L'hotel dall'alto, la spiaggia, l'ingresso, la pasticceria."
