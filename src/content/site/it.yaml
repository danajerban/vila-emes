    booking_label: "Booking.com"
    google_label: "Google"
    quote:
      text: "Accogliente hotel a conduzione familiare. Personale eccezionalmente gentile, sempre cordiale e disponibile. Posizione eccellente. Tutto ciò di cui avete bisogno è nelle vicinanze. A due passi dalla spiaggia. Altamente consigliato!"
      author: "Gry"
      location: "Norvegia"
      when: "soggiorno della scorsa estate"
