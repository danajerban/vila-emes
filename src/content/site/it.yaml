    polaroid_caption_handwritten: "— la zona della spiaggia"
  about:
    eyebrow: "La nostra storia"
    heading_part_1: "Una piccola casa,"
    heading_part_2_handwritten: "gestita da una famiglia."
    handwritten_year: "— dal 1998"
    body:
      - "Vila Emes ha aperto nel 1998. Da allora la stessa famiglia gestisce l'attività e accoglie gli ospiti."
      - "Ci troviamo in Rruga Pavarësia a Plazh, il viale che costeggia la spiaggia di Durrës. La pasticceria al piano terra apre presto — cappuccino, espresso, croissant freschi. Ristoranti, supermercati e la fermata dell'autobus sono a pochi minuti."
      - "Cento metri dall'acqua, reception 24 ore su 24, camere semplici curate ogni giorno — non un albergo di lusso, solo un posto con un vero cuore."
    signature_handwritten: "— con amore, la famiglia Emes"
    photo_caption: "Vila Emes · Plazh, Durrës"
