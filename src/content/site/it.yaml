hotel:
  name: "Vila Emes"
  tagline: "Un hotel di famiglia sul mare"
  location: "Plazh, Durrës · Albania"

home:
  hero:
    eyebrow: "Durrës · Albania · Dal 1998"
    welcome_handwritten: "benvenuti a"
    heading: "Vila Emes"
    tagline_stable: "Un hotel di famiglia"
    tagline_rotators:
      - "sul mare"
      - "dal 1998"
      - "con amore"
      - "a 100 m dall'acqua"
    sub: "Undici tipologie di camere. Una famiglia che apre la porta di persona. Lo stesso caffè in terrazza ogni mattina."
    cta_primary: "Prenota su Booking.com"
    cta_secondary: "Apri in Maps"
    polaroid_caption_handwritten: "— la famiglia Emes"
  about:
    eyebrow: "La nostra storia"
    heading_part_1: "Una piccola casa,"
    heading_part_2_handwritten: "gestita da una famiglia."
    handwritten_year: "— dal 1998"
    body:
      - "Vila Emes ha aperto nel 1998. La stessa famiglia gestisce la casa: in due accolgono gli ospiti quasi tutti i giorni, e le stesse mani che preparano gli asciugamani puliti sanno quale camera viene illuminata per prima dalla luce del mattino."
      - "Ci troviamo in Rruga Pavarësia a Plazh, il lungo viale che costeggia la spiaggia di Durrës. La pasticceria al piano terra apre presto — cappuccino, espresso, croissant freschi — a cinque passi dalla hall. Ristoranti, supermercati e la fermata dell'autobus sono tutti raggiungibili con una breve passeggiata."
      - "Cosa aspettarsi: cento metri dall'acqua, reception aperta 24 ore su 24, camere semplici curate ogni giorno e il proprietario che vi riserva un posto auto davanti all'ingresso (a volte con una sedia sopra). Non è un hotel di lusso. È una piccola casa con un vero cuore."
    signature_handwritten: "— con amore, la famiglia Emes"
    photo_caption: "Vila Emes · Plazh, Durrës"
  trust:
    booking_label: "Booking.com"
    google_label: "Google"
    quote:
      text: "Accogliente hotel a conduzione familiare. Personale eccezionalmente gentile, sempre cordiale e disponibile. Posizione eccellente. Tutto ciò di cui avete bisogno è nelle vicinanze. A due passi dalla spiaggia. Altamente consigliato!"
      author: "Gry"
      location: "Norvegia"
      when: "ha soggiornato l'estate scorsa"
    read_all_reviews_label: "Leggi tutte le recensioni su Booking →"
    read_all_reviews_url: "https://www.booking.com/hotel/al/vila-emes.html#tab-reviews"
  rooms:
    eyebrow: "Soggiorno"
    heading: "Le nostre camere"
    intro: "Undici tipologie in totale, da una matrimoniale di 30 m² a un appartamento di 90 m² con vista mare."
    preview_card_cta: "Vedi i dettagli →"
  gallery:
    eyebrow: "Dentro e fuori"
    heading: "Dodici inquadrature"
    intro: "Camere, terrazza, colazione, la passeggiata fino al mare."
    captions:
      "DSC_0123": "balcone, camera 204"
      "DSC_0145": "la passeggiata fino all'acqua"
      "DSC_0169": "prima luce, agosto"
      "DSC_0204": "il nostro angolo caffè"
    alts:
      - "Vista drone di Vila Emes"
      - "Drone verso la spiaggia"
      - "Esterno dell'edificio dall'alto"
      - "Viale e palme"
      - "Terrazza sul tetto"
      - "Spiaggia di Durrës"
      - "La famiglia Emes"
      - "Interno camera Deluxe"
      - "Appartamento con terrazza"
      - "Appartamento bilocale"
      - "Camera standard con vista mare"
      - "Camera Deluxe Queen"
  location:
    eyebrow: "Dove siamo"
    heading: "Sul viale, in riva al mare"
    cta: "Apri in Maps"
  contact_strip:
    eyebrow: "Vieni a salutarci"
    heading_part_1: "Mettiti in"
    heading_part_2_handwritten: "contatto"
    tile_labels:
      phone: "Telefono"
      whatsapp: "WhatsApp"
      email: "Email"
      instagram: "Instagram"
      booking: "Booking.com"
  faq:
    eyebrow: "Prima di chiedere"
    heading_part_1: "Domande"
    heading_part_2_handwritten: "frequenti"
    items:
      - q: "A che ora sono il check-in e il check-out?"
        a: "Check-in dalle 12:00 alle 18:00. Check-out dalle 07:00 alle 11:00. La reception è aperta 24 ore su 24, quindi gli arrivi tardivi non sono un problema — basta avvisarci su WhatsApp così possiamo accogliervi."
      - q: "La colazione è inclusa?"
        a: "La colazione non è inclusa nel prezzo della camera, ma la nostra pasticceria al piano terra apre presto e serve cappuccino, espresso e pasticcini freschi — a cinque passi dalla hall."
      - q: "Dove posso parcheggiare?"
        a: "Parcheggio gratuito sulla strada davanti all'hotel. Il proprietario vi riserverà un posto con una sedia se può — primo arrivato, primo servito."
      - q: "Sono ammessi animali domestici?"
        a: "Gli animali domestici non sono ammessi a Vila Emes."
      - q: "Sono disponibili culle o letti supplementari?"
        a: "Le culle non sono disponibili. È possibile aggiungere un letto supplementare nella maggior parte delle camere al costo di 5 € a persona, a notte — vi preghiamo di comunicarcelo in anticipo."
      - q: "Quali lingue parlate?"
        a: "Inglese, italiano e albanese — tutti i giorni, tutto il giorno."
    footer_cta_handwritten: "Non trovate la vostra domanda? Scriveteci →"
  ready_cta:
    handwritten: "— pronti a venire?"
    heading: "Prenotate il vostro soggiorno a Vila Emes"
    sub: "Scegliete le date su Booking.com, scriveteci su WhatsApp, o apriteci in Maps."
    wa_text: "Ciao, vorrei prenotare a Vila Emes"
    book_label: "Prenota su Booking.com"
    whatsapp_label: "Scrivici su WhatsApp"
    map_label: "Apri in Maps"

