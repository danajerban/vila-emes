hotel:
  name: "Vila Emes"
  tagline: "Un hotel di famiglia sul mare"
  location: "Plazh, Durrës · Albania"

seo:
  home:
    title: "Vila Emes — Albergo a conduzione familiare a Durrës"
    description: "A conduzione familiare dal 1998 a Plazh, Durrës — 100 m dall'acqua, 11 tipologie, 9.0 su Booking. Prenota diretto, su Booking.com o su WhatsApp."
  rooms:
    title: "Camere e appartamenti — Vila Emes, Spiaggia di Durrës"
    description: "11 tipologie a Vila Emes, da una Deluxe di 30 m² a un appartamento bilocale di 90 m² con vista mare. Aria condizionata, Wi-Fi gratis, balconi."
  contact:
    title: "Contatta Vila Emes — Telefono, WhatsApp, Email"
    description: "Mettiti in contatto con Vila Emes a Plazh, Durrës. Reception 24 ore, WhatsApp, telefono, email — leggiamo ogni messaggio noi e rispondiamo in giornata."

