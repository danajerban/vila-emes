      - "Pasticceria al piano terra"
      - "Vila Emes vicino al mare"
      - "Vista aerea del quartiere"
  location:
    eyebrow: "Dove siamo"
    heading: "Sul viale, in riva al mare"
    cta: "Apri la mappa"
  contact_strip:
    eyebrow: "Vieni a salutarci"
    heading_part_1: "Scrivici"
    heading_part_2_handwritten: "due righe"
    tile_labels:
      phone: "Telefono"
      whatsapp: "WhatsApp"
      email: "Email"
      instagram: "Instagram"
      booking: "Booking.com"
  faq:
    eyebrow: "Prima di chiedere"
    heading_part_1: "Domande"
    heading_part_2_handwritten: "frequenti"
    items:
      - q: "A che ora sono il check-in e il check-out?"
        a: "Check-in dalle 12:00 alle 18:00. Check-out dalle 07:00 alle 11:00. La reception è aperta 24 ore su 24, quindi gli arrivi tardivi non sono un problema — basta avvisarci su WhatsApp così possiamo accogliervi."
      - q: "La colazione è inclusa?"
        a: "La colazione non è inclusa nel prezzo della camera, ma la nostra pasticceria al piano terra apre presto e serve cappuccino, espresso e pasticcini freschi — a cinque passi dalla hall."
      - q: "I lettini in spiaggia sono inclusi?"
        a: "I lettini e gli ombrelloni in spiaggia non sono inclusi nel prezzo della camera. Si noleggiano direttamente in spiaggia, a giornata."
      - q: "Dove posso parcheggiare?"
        a: "Parcheggio pubblico gratuito proprio davanti all'hotel. Cerchiamo di tenerti un posto quando possiamo — chi prima arriva, prima alloggia :)"
      - q: "Quali metodi di pagamento accettate?"
        a: "Accettiamo contanti, Visa, Mastercard, Apple Pay e Google Pay — alla reception all'arrivo."
      - q: "Sono ammessi animali domestici?"
        a: "Gli animali domestici non sono ammessi a Vila Emes."
      - q: "Sono disponibili culle o letti supplementari?"
        a: "Non abbiamo culle. Un letto supplementare si può aggiungere nella maggior parte delle camere a 5 € a persona per notte — faccelo sapere in anticipo."
      - q: "Quali lingue parlate?"
        a: "Inglese, italiano e albanese — tutti i giorni, dalla mattina alla sera."
    footer_cta_handwritten: "Non trovi la tua domanda? Scrivici →"
  ready_cta:
    handwritten: "— ancora indecisi?"
    heading: "Prenota il tuo soggiorno a Vila Emes"
    sub: "Scegli le date su Booking.com o trovaci sulla mappa."
    wa_text: "Ciao, vorrei prenotare a Vila Emes"
    book_label: "Prenota su Booking.com"
    map_label: "Apri la mappa"

