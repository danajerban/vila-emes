    cta_primary: "Auf Booking.com buchen"
    cta_secondary: "Karte öffnen"
    polaroid_caption_handwritten: "— der Strandbereich"
  about:
    eyebrow: "Unsere Geschichte"
    heading_part_1: "Ein kleines Haus,"
    heading_part_2_handwritten: "geführt von einer Familie."
    handwritten_year: "— seit 1998"
    body:
      - "Die Vila Emes wurde 1998 eröffnet. Seitdem führt dieselbe Familie den Betrieb und begrüßt die Gäste."
      - "Wir befinden uns an der Rruga Pavarësia in Plazh, der Allee am Strand entlang in Durrës. Die Bäckerei in unserem Erdgeschoss öffnet früh — Cappuccino, Espresso, frische Croissants. Restaurants, Supermärkte und die Bushaltestelle sind nur wenige Minuten entfernt."
      - "Hundert Meter bis zum Wasser, 24-Stunden-Rezeption, einfache, täglich gepflegte Zimmer — kein Luxushotel, sondern ein Ort mit echtem Herz."
    signature_handwritten: "— mit Liebe, die Familie Emes"
    photo_caption: "Vila Emes · Plazh, Durrës"
  trust:
    booking_label: "Booking.com"
    google_label: "Google"
    quote:
      text: "Gemütliches familiengeführtes Hotel. Außergewöhnlich nettes Personal, immer freundlich und hilfsbereit. Hervorragende Lage. Alles, was man braucht, ist in der Nähe. Nur einen Steinwurf vom Strand entfernt. Sehr empfehlenswert!"
      author: "Gry"
      location: "Norwegen"
      when: "Aufenthalt letzten Sommer"
    read_all_reviews_label: "Alle Bewertungen auf Booking lesen →"
    read_all_reviews_url: "https://www.booking.com/hotel/al/vila-emes.html#tab-reviews"
  rooms:
    eyebrow: "Übernachten"
    heading: "Unsere Zimmer"
    intro: "Insgesamt 11 Zimmerkategorien, vom 30 m² großen Doppelzimmer bis zum 90 m² großen Apartment mit Meerblick."
    preview_card_cta: "Details ansehen →"
  gallery:
    eyebrow: "Innen & Außen"
    heading: "Sechs Bilder"
    intro: "Das Hotel von oben, der Strand, der Eingang, die Konditorei."
    captions:
      - "das erste Licht"
      - "der Strandbereich"
      - "der Eingang"
      - "die Konditorei"
      - "die Lage"
      - "die Nachbarschaft"
    alts:
      - "Vila Emes von oben im ersten Licht"
      - "Strand wenige Minuten vom Hotel entfernt"
      - "Eingang der Vila Emes"
      - "Konditorei im Erdgeschoss"
      - "Vila Emes am Meer"
      - "Luftaufnahme der Nachbarschaft"
  location:
    eyebrow: "Wo wir sind"
    heading: "An der Allee, am Meer"
    cta: "Karte öffnen"
  contact_strip:
    eyebrow: "Wir freuen uns auf Ihren Besuch"
    heading_part_1: "Sagen Sie"
    heading_part_2_handwritten: "Hallo"
    tile_labels:
      phone: "Telefon"
      whatsapp: "WhatsApp"
      email: "E-Mail"
      instagram: "Instagram"
      booking: "Booking.com"
  faq:
    eyebrow: "Bevor Sie fragen"
    heading_part_1: "Häufig"
    heading_part_2_handwritten: "gefragt"
    items:
      - q: "Wann ist Check-in und Check-out?"
        a: "Check-in von 12:00 bis 18:00 Uhr. Check-out von 07:00 bis 11:00 Uhr. Die Rezeption ist 24 Stunden besetzt, späte Anreisen sind also kein Problem — geben Sie uns einfach per WhatsApp Bescheid, damit wir Sie empfangen können."
      - q: "Ist das Frühstück inklusive?"
        a: "Das Frühstück ist nicht im Zimmerpreis enthalten. Unsere Bäckerei im Erdgeschoss öffnet jedoch früh und serviert Cappuccino, Espresso und frisches Gebäck — nur fünf Schritte von der Lobby entfernt."
      - q: "Sind Strandliegen inklusive?"
        a: "Strandliegen und Sonnenschirme am Strand sind nicht im Zimmerpreis enthalten. Sie werden direkt am Strand tageweise gemietet."
      - q: "Wo kann ich parken?"
        a: "Kostenlose öffentliche Parkplätze direkt vor dem Hotel. Wir halten Ihnen nach Möglichkeit einen Platz frei — wer zuerst kommt, parkt zuerst :)"
      - q: "Welche Zahlungsmethoden akzeptieren Sie?"
        a: "Wir akzeptieren Bargeld, Visa, Mastercard, Apple Pay und Google Pay — an der Rezeption bei der Anreise."
      - q: "Sind Haustiere erlaubt?"
        a: "Haustiere sind in der Vila Emes nicht erlaubt."
      - q: "Sind Babybetten oder Zustellbetten verfügbar?"
        a: "Babybetten sind nicht verfügbar. Ein Zustellbett kann in den meisten Zimmern für 5 € pro Person und Nacht hinzugefügt werden — bitte geben Sie uns im Voraus Bescheid."
      - q: "Welche Sprachen sprechen Sie?"
        a: "Englisch, Italienisch und Albanisch — jeden Tag, von früh bis spät."
    footer_cta_handwritten: "Ihre Frage ist nicht dabei? Schreiben Sie uns →"
  ready_cta:
    handwritten: "— noch am Überlegen?"
    heading: "Buchen Sie Ihren Aufenthalt in der Vila Emes"
    sub: "Wählen Sie Ihre Daten auf Booking.com oder finden Sie uns auf der Karte."
    wa_text: "Hallo, ich möchte ein Zimmer im Vila Emes buchen"
    book_label: "Auf Booking.com buchen"
    map_label: "Karte öffnen"

