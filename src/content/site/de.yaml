hotel:
  name: "Vila Emes"
  tagline: "Ein Familienhotel am Meer"
  location: "Plazh, Durrës · Albanien"

home:
  hero:
    eyebrow: "Durrës · Albanien · Seit 1998"
    welcome_handwritten: "willkommen im"
    heading: "Vila Emes"
    tagline_stable: "Ein Familienhotel"
    tagline_rotators:
      - "am Meer"
      - "seit 1998"
      - "mit Liebe"
      - "100 m vom Wasser"
    sub: "Elf Zimmerkategorien. Eine Familie, die Ihnen selbst die Tür öffnet. Jeden Morgen der gleiche Kaffee auf der Terrasse."
    cta_primary: "Auf Booking.com buchen"
    cta_secondary: "In Karten öffnen"
    polaroid_caption_handwritten: "— die Familie Emes"
  about:
    eyebrow: "Unsere Geschichte"
    heading_part_1: "Ein kleines Haus,"
    heading_part_2_handwritten: "geführt von einer Familie."
    handwritten_year: "— seit 1998"
    body:
      - "Die Vila Emes wurde 1998 eröffnet. Dieselbe Familie führt das Haus — zwei von ihnen begrüßen die Gäste fast täglich, und dieselben Hände, die frische Handtücher bereitlegen, wissen, welches Zimmer als erstes die Morgensonne einfängt."
      - "Wir befinden uns an der Rruga Pavarësia in Plazh, der langen Allee oberhalb des Strandes in Durrës. Die Bäckerei in unserem Erdgeschoss öffnet früh — Cappuccino, Espresso, frische Croissants — nur fünf Schritte von der Lobby entfernt. Restaurants, Supermärkte und die Bushaltestelle sind alle fußläufig erreichbar."
      - "Was Sie erwartet: hundert Meter bis zum Wasser, eine 24-Stunden-Rezeption, einfache, täglich gepflegte Zimmer und der Inhaber, der Ihnen einen Parkplatz vor dem Haus reserviert (manchmal sogar mit einem Stuhl darauf). Es ist kein Luxushotel. Es ist ein kleines Haus mit viel Herz."
    signature_handwritten: "— mit Liebe, die Familie Emes"
    photo_caption: "Vila Emes · Plazh, Durrës"
  trust:
    booking_label: "Booking.com"
    google_label: "Google"
    quote:
      text: "Gemütliches familiengeführtes Hotel. Außergewöhnlich nettes Personal, immer freundlich und hilfsbereit. Hervorragende Lage. Alles, was man braucht, ist in der Nähe. Nur einen Steinwurf vom Strand entfernt. Sehr empfehlenswert!"
      author: "Gry"
      location: "Norwegen"
      when: "übernachtete letzten Sommer"
    read_all_reviews_label: "Alle Bewertungen auf Booking lesen →"
    read_all_reviews_url: "https://www.booking.com/hotel/al/vila-emes.html#tab-reviews"
  rooms:
    eyebrow: "Übernachten"
    heading: "Unsere Zimmer"
    intro: "Insgesamt elf Zimmerkategorien, vom 30 m² großen Doppelzimmer bis zum 90 m² großen Apartment mit Meerblick."
    preview_card_cta: "Details ansehen →"
  gallery:
    eyebrow: "Innen & Außen"
    heading: "Zwölf Bilder"
    intro: "Zimmer, Terrasse, Frühstück, der Weg zum Wasser."
    captions:
      "DSC_0123": "Balkon, Zimmer 204"
      "DSC_0145": "der Weg hinunter zum Wasser"
      "DSC_0169": "erstes Licht, August"
      "DSC_0204": "unsere Kaffeeecke"
  location:
    eyebrow: "Wo wir sind"
    heading: "An der Allee, am Meer"
    cta: "In Karten öffnen"
  contact_strip:
    eyebrow: "Kommen Sie vorbei und sagen Sie Hallo"
    heading_part_1: "Kontakt"
    heading_part_2_handwritten: "aufnehmen"
  faq:
    eyebrow: "Bevor Sie fragen"
    heading_part_1: "Häufig"
    heading_part_2_handwritten: "gefragt"
    items:
      - q: "Wann ist Check-in und Check-out?"
        a: "Check-in von 12:00 bis 18:00 Uhr. Check-out von 07:00 bis 11:00 Uhr. Die Rezeption ist 24 Stunden besetzt, späte Anreisen sind also kein Problem — geben Sie uns einfach per WhatsApp Bescheid, damit wir Sie empfangen können."
      - q: "Ist das Frühstück inklusive?"
        a: "Das Frühstück ist nicht im Zimmerpreis enthalten. Unsere Bäckerei im Erdgeschoss öffnet jedoch früh und serviert Cappuccino, Espresso und frisches Gebäck — nur fünf Schritte von der Lobby entfernt."
      - q: "Wo kann ich parken?"
        a: "Kostenlose Parkplätze an der Straße vor dem Hotel. Der Inhaber reserviert Ihnen nach Möglichkeit einen Platz mit einem Stuhl — solange Plätze verfügbar sind."
      - q: "Sind Haustiere erlaubt?"
        a: "Haustiere sind in der Vila Emes nicht erlaubt."
      - q: "Sind Babybetten oder Zustellbetten verfügbar?"
        a: "Babybetten sind nicht verfügbar. Ein Zustellbett kann in den meisten Zimmern für 5 € pro Person und Nacht hinzugefügt werden — bitte geben Sie uns im Voraus Bescheid."
      - q: "Welche Sprachen sprechen Sie?"
        a: "Englisch, Italienisch und Albanisch — jeden Tag, rund um die Uhr."
    footer_cta_handwritten: "Ihre Frage ist nicht dabei? Schreiben Sie uns →"
  ready_cta:
    handwritten: "— bereit zu kommen?"
    heading: "Buchen Sie Ihren Aufenthalt in der Vila Emes"
    sub: "Wählen Sie Ihre Daten auf Booking.com, schreiben Sie uns auf WhatsApp oder öffnen Sie uns in Maps."
    wa_text: "Hallo, ich möchte im Vila Emes buchen"
    book_label: "Auf Booking.com buchen"
    whatsapp_label: "WhatsApp schreiben"
    map_label: "In Karten öffnen"

