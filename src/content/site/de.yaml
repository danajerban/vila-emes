hotel:
  name: "Vila Emes"
  tagline: "Ein Familienhotel am Meer"
  location: "Plazh, Durrës · Albanien"

seo:
  home:
    title: "Vila Emes — Familienhotel am Meer in Durrës"
    description: "Familiengeführt seit 1998 in Plazh, Durrës — 100 m vom Wasser, 11 Zimmerkategorien, 9.0 auf Booking. Direkt, auf Booking.com oder per WhatsApp buchen."
  rooms:
    title: "Zimmer & Apartments — Vila Emes, Strand von Durrës"
    description: "11 Zimmerkategorien in der Vila Emes — vom 30 m² Deluxe bis zum 90 m² Apartment mit zwei Schlafzimmern und Meerblick. Klimaanlage, WLAN, Balkone."
  contact:
    title: "Kontakt Vila Emes — Telefon, WhatsApp, E-Mail"
    description: "Kontakt zu Vila Emes in Plazh, Durrës. 24-h-Rezeption, WhatsApp, Telefon, E-Mail — wir lesen jede Nachricht selbst und antworten noch am selben Tag."

home:
  hero:
    eyebrow: "Durrës · Albanien · Seit 1998"
    welcome_handwritten: "willkommen im"
    heading: "Vila Emes"
    tagline_stable: "Ein Familienhotel"
