    sub: "Njëmbëdhjetë planimetri. Një familje që ju hap derën vetë. E njëjta kafe në tarracë çdo mëngjes."
    cta_primary: "Rezervo në Booking.com"
    cta_secondary: "Hap në Harta"
    polaroid_caption_handwritten: "— familja Emes"
  about:
    eyebrow: "Historia jonë"
    heading_part_1: "Një shtëpi e vogël,"
    heading_part_2_handwritten: "e mbajtur nga një familje."
    handwritten_year: "— që nga 1998"
    body:
      - "Vila Emes u hap në vitin 1998. E njëjta familje kujdeset për shtëpinë — dy prej tyre i mirëpresin mysafirët shumicën e ditëve, dhe të njëjtat duar që shtrojnë peshqirët e freskët e dinë se cila dhomë e kap e para dritën e mëngjesit."
      - "Ndodhemi në Rrugën Pavarësia në Plazh, bulevardi i gjatë që shtrihet mbi plazhin e Durrësit. Pastiçeria në katin përdhes hapet herët — kapuçino, espresso, kroasanë të freskët — pesë hapa nga holli. Restorantet, supermarketet dhe stacioni i autobusit janë të gjitha brenda një shëtitjeje të shkurtër."
      - "Çfarë të prisni: njëqind metra nga deti, një recepsion 24-orësh, dhoma të thjeshta të mirëmbajtura çdo ditë, dhe pronari ju rezervon një vend parkimi përpara (ndonjëherë me një karrige mbi të). Nuk është një hotel luksoz. Është një shtëpi e vogël me një zemër të vërtetë."
    signature_handwritten: "— me dashuri, familja Emes"
    photo_caption: "Vila Emes · Plazh, Durrës"
  trust:
    booking_label: "Booking.com"
    google_label: "Google"
    quote:
      text: "Hotel familjar dhe i ngrohtë. Stafi është jashtëzakonisht i sjellshëm, gjithmonë miqësor dhe i gatshëm të ndihmojë. Vendndodhje e shkëlqyer. Gjithçka që ju nevojitet është afër. Vetëm dy hapa nga plazhi. Rekomandohet pa hezitim!"
      author: "Gry"
      location: "Norvegji"
      when: "qëndroi verën e kaluar"
    read_all_reviews_label: "Lexo të gjitha rishikimet në Booking →"
    read_all_reviews_url: "https://www.booking.com/hotel/al/vila-emes.html#tab-reviews"
  rooms:
    eyebrow: "Qëndroni"
    heading: "Dhomat tona"
    intro: "Njëmbëdhjetë planimetri gjithsej, nga një dhomë dyshe 30 m² te një apartament 90 m² me pamje nga deti."
