  faq:
    eyebrow: "Para se të pyesni"
    heading_part_1: "Pyetje"
    heading_part_2_handwritten: "të shpeshta"
    items:
      - q: "Në çfarë ore janë check-in dhe check-out?"
        a: "Check-in nga 12:00 deri 18:00. Check-out nga 07:00 deri 11:00. Recepsioni është i hapur 24 orë, kështu që mbërritjet e vona janë në rregull — thjesht na njoftoni në WhatsApp dhe ju presim."
      - q: "A përfshihet mëngjesi?"
        a: "Mëngjesi nuk përfshihet në çmimin e dhomës, por pastiçeria jonë në katin përdhes hapet herët dhe shërben kapuçino, espresso dhe ëmbëlsira të freskëta — 5 hapa nga recepsioni."
      - q: "A përfshihen shtretërit e plazhit?"
        a: "Shtretërit dhe çadrat e plazhit nuk përfshihen në çmimin e dhomës. Ato merren me qira drejtpërdrejt te plazhi, për ditën."
      - q: "Ku mund të parkoj?"
        a: "Parkim publik falas në rrugë, pikërisht përpara hotelit. Përpiqemi t'ju mbajmë një vend kur mundemi — kush vjen i pari, e zë i pari :)"
      - q: "Çfarë mënyra pagese pranoni?"
        a: "Pranojmë para në dorë, Visa, Mastercard, Apple Pay dhe Google Pay — në recepsion në mbërritje."
      - q: "A lejohen kafshët shtëpiake?"
        a: "Kafshët shtëpiake nuk lejohen në Vila Emes."
      - q: "A ofroni djepa ose shtretër shtesë?"
        a: "Djepa nuk ofrojmë. Një shtrat shtesë mund të shtohet në shumicën e dhomave — 5 € për person, për natë. Na lajmëroni paraprakisht."
      - q: "Si shkoj nga aeroporti i Tiranës?"
        a: "Aeroporti Ndërkombëtar i Tiranës (TIA / Rinas) është 35 km larg — taksitë qarkullojnë gjithë ditën nga stacioni i aeroportit, rreth 35 minuta me makinë në trafik të lehtë. Na dërgo detajet e fluturimit në WhatsApp dhe do të të ndihmojmë me rrugën. Autobusët publikë për Durrësin nisen nga qendra e Tiranës."
      - q: "Çfarë gjuhësh flisni?"
        a: "Anglisht, italisht dhe shqip — çdo ditë, gjithë ditën."
    footer_cta_handwritten: "Nuk e gjeni pyetjen tuaj? Na shkruani →"
  ready_cta:
    handwritten: "— ende po vendosni?"
    heading: "Rezervo qëndrimin tuaj në Vila Emes"
    sub: "Zgjidh datat në Booking.com ose na gjeni në hartë."
