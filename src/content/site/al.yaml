    description: "Hotel familjar ekonomik në Plazh, Durrës — 100 m nga deti, vlerë e mirë. 9 tipologji dhomash, 9.0/10 në Booking. Pushime familjare që nga 1998."
  rooms:
    title: "Dhoma ekonomike & apartamente — Vila Emes, Plazh, Durrës"
    description: "9 tipologji në Vila Emes pranë plazhit të Durrësit, nga Deluxe 30 m² te apartament 90 m² me pamje deti. Dhoma familjare me çmim të lirë."
  contact:
    title: "Kontakt Vila Emes — Telefon, WhatsApp, Email"
    description: "Na kontaktoni në Vila Emes, hotel familjar në Plazh, Durrës. Recepsion 24-orësh, WhatsApp, telefon, email — përgjigjemi po atë ditë."
  hotel_description: "Hotel familjar ekonomik me çmim të lirë në Plazh, Durrës, 100 m nga deti — vlerë e mirë për pushime familjare që nga 1998."
  og_image_alt: "Pamja e përparme e Vila Emes — hotel familjar në bulevardin me palma në Plazh, Durrës"

