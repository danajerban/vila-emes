    eyebrow: "Historia jonë"
    heading_part_1: "Një shtëpi e vogël,"
    heading_part_2_handwritten: "e mbajtur nga një familje."
    handwritten_year: "— që nga 1998"
    body:
      - "Vila Emes u hap në vitin 1998. E njëjta familje drejton biznesin dhe mirëpret mysafirët që atëherë."
      - "Ndodhemi në Rrugën Pavarësia në Plazh, bulevardi përgjatë plazhit të Durrësit. Pastiçeria në katin përdhes hapet herët — kapuçino, espresso, kroasanë të freskët. Restorantet, supermarketet dhe stacioni i autobusit janë vetëm pak minuta larg."
      - "100 metra nga deti, recepsion 24-orësh, dhoma të thjeshta të mirëmbajtura çdo ditë — jo një hotel luksoz, thjesht një vend me një zemër të vërtetë."
    signature_handwritten: "— me dashuri, familja Emes"
    photo_caption: "Vila Emes · Plazh, Durrës"
  trust:
    booking_label: "Booking.com"
    google_label: "Google"
    quotes:
      - text: "Hotel familjar dhe i ngrohtë. Stafi është jashtëzakonisht i sjellshëm, gjithmonë miqësor dhe i gatshëm të ndihmojë. Vendndodhje e shkëlqyer. Gjithçka që ju nevojitet është afër. Vetëm 2 hapa nga plazhi. Rekomandohet pa hezitim!"
        author: "Gry"
        location: "Norvegji"
        when: "qëndroi verën e kaluar"
      - text: "Nuk është një hotel luksoz fasadë — është një vend i thjeshtë me një zemër të vërtetë."
        author: "Baling"
        location: "Hungari"
      - text: "Pronarët bënë gjithçka për ta bërë qëndrimin tonë sa më të këndshëm. Do të kthehemi pa hezitim."
        author: "Mikhail"
        location: "Shtetet e Bashkuara"
      - text: "Shumë afër plazhit, pronar miqësor, plot restorante — për çmimin që paguam, ia vlejti pa diskutim."
        author: "Loubna"
        location: "Francë"
