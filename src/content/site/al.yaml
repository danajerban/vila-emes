    heading: "Në bulevard, pranë detit"
    cta: "Hap në Harta"
  contact_strip:
    eyebrow: "Ejani të na përshëndetni"
    heading_part_1: "Na"
    heading_part_2_handwritten: "shkruani"
    tile_labels:
      phone: "Telefon"
      whatsapp: "WhatsApp"
      email: "Email"
      instagram: "Instagram"
      booking: "Booking.com"
  faq:
    eyebrow: "Para se të pyesni"
    heading_part_1: "Pyetje"
    heading_part_2_handwritten: "të shpeshta"
    items:
      - q: "Në çfarë ore janë check-in dhe check-out?"
        a: "Check-in nga 12:00 deri 18:00. Check-out nga 07:00 deri 11:00. Recepsioni është i hapur 24 orë, kështu që mbërritjet e vona janë në rregull — thjesht na njoftoni në WhatsApp dhe ju presim."
      - q: "A përfshihet mëngjesi?"
        a: "Mëngjesi nuk përfshihet në çmimin e dhomës, por pastiçeria jonë në katin përdhes hapet herët dhe shërben kapuçino, espresso dhe ëmbëlsira të freskëta — pesë hapa nga holli."
      - q: "Ku mund të parkoj?"
        a: "Parkim falas në rrugë përpara hotelit. Pronari do t'ju rezervojë një vend me një karrige nëse mundet — sipas radhës së ardhjes."
      - q: "A lejohen kafshët shtëpiake?"
        a: "Kafshët shtëpiake nuk lejohen në Vila Emes."
      - q: "A ofroni djepa ose shtretër shtesë?"
        a: "Djepat nuk janë në dispozicion. Një shtrat shtesë mund të shtohet në shumicën e dhomave për 5 € për person, për natë — na njoftoni paraprakisht."
      - q: "Çfarë gjuhësh flisni?"
        a: "Anglisht, italisht dhe shqip — çdo ditë, gjithë ditën."
    footer_cta_handwritten: "Nuk e gjeni pyetjen tuaj? Na shkruani →"
  ready_cta:
    handwritten: "— gati për të ardhur?"
    heading: "Rezervo qëndrimin tuaj në Vila Emes"
    sub: "Zgjidh datat në Booking.com, na shkruaj në WhatsApp, ose na hap në Harta."
    wa_text: "Përshëndetje, dëshiroj të rezervoj në Vila Emes"
    book_label: "Rezervo në Booking.com"
    whatsapp_label: "Na shkruaj në WhatsApp"
    map_label: "Hap në Harta"

