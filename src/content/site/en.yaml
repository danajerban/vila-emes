hotel:
  name: "Vila Emes"
  tagline: "A family hotel by the sea"
  location: "Plazh, Durrës · Albania"

seo:
  home:
    title: "Vila Emes — A Family Hotel by the Sea in Durrës"
    description: "Family-run since 1998 in Plazh, Durrës — 100 m from the water, 11 layouts, 9.0 on Booking. Book direct, on Booking.com, or message us on WhatsApp."
  rooms:
    title: "Rooms & Apartments — Vila Emes, Durrës Beach"
    description: "11 layouts at Vila Emes, from a 30 m² Deluxe to a 90 m² two-bedroom apartment with sea view. Air conditioning, free Wi-Fi, balconies and terraces."
  contact:
    title: "Contact Vila Emes — Phone, WhatsApp, Email"
    description: "Get in touch with Vila Emes in Plazh, Durrës. 24-hour front desk, WhatsApp, phone, email — we read every message ourselves and reply the same day."

home:
  hero:
    eyebrow: "Durrës · Albania · Since 1998"
    welcome_handwritten: "welcome to"
    heading: "Vila Emes"
    tagline_stable: "A family hotel"
    tagline_rotators:
      - "by the sea"
      - "since 1998"
      - "with love"
      - "100 m from the water"
    sub: "11 layouts. A family that opens the door in person. The same coffee on the terrace every morning."
    cta_primary: "Book on Booking.com"
    cta_secondary: "Open the map"
    polaroid_caption_handwritten: "— the beach area"
  about:
    eyebrow: "Our story"
    heading_part_1: "A small house,"
    heading_part_2_handwritten: "kept by one family."
    handwritten_year: "— since 1998"
    body:
      - "Vila Emes opened in 1998. The same family has run the business and welcomed guests ever since."
      - "We sit on Rruga Pavarësia in Plazh, the avenue along the beach in Durrës. The pastry shop downstairs opens early — cappuccino, espresso, fresh croissants. Restaurants, supermarkets, and the bus stop are minutes away."
      - "A hundred metres to the water, 24-hour front desk, simple rooms cared for daily — not a luxury hotel, just a place with a real heart."
    signature_handwritten: "— with love, the Emes family"
    photo_caption: "Vila Emes · Plazh, Durrës"
  trust:
    booking_label: "Booking.com"
    google_label: "Google"
    quote:
      text: "Cozy family-run hotel. Exceptionally nice staff, always friendly and helpful. Excellent location. Everything you need is nearby. Just a stone's throw from the beach. Highly recommended!"
      author: "Gry"
      location: "Norway"
      when: "stayed last summer"
    read_all_reviews_label: "Read all reviews on Booking →"
    read_all_reviews_url: "https://www.booking.com/hotel/al/vila-emes.html#tab-reviews"
  rooms:
    eyebrow: "Stay"
    heading: "Our Rooms"
    intro: "11 layouts in total, from a 30 m² double to a 90 m² apartment with sea view."
    preview_card_cta: "View details →"
  gallery:
    eyebrow: "Inside & out"
    heading: "Six frames"
    intro: "The hotel from above, the beach, the doorway, the pastry shop."
    captions:
      - "the first light"
      - "the beach area"
      - "the entrance"
      - "the pastry shop"
      - "the location"
      - "the neighborhood"
    alts:
      - "Vila Emes from above at first light"
      - "Beach a few minutes from the hotel"
      - "Vila Emes entrance"
      - "Pastry shop on the ground floor"
      - "Vila Emes by the sea"
      - "Aerial view of the neighborhood"
  location:
    eyebrow: "Where we are"
    heading: "On the avenue, by the sea"
    cta: "Open the map"
  contact_strip:
    eyebrow: "Come say hello"
    heading_part_1: "Get in"
    heading_part_2_handwritten: "touch"
    tile_labels:
      phone: "Phone"
      whatsapp: "WhatsApp"
      email: "Email"
      instagram: "Instagram"
      booking: "Booking.com"
  faq:
    eyebrow: "Before you ask"
    heading_part_1: "Frequently"
    heading_part_2_handwritten: "asked"
    items:
      - q: "What time is check-in and check-out?"
        a: "Check-in from 12:00 to 18:00. Check-out from 07:00 to 11:00. The front desk is open 24 hours, so late arrivals are fine — just let us know by WhatsApp so we can meet you."
      - q: "Is breakfast included?"
        a: "Breakfast is not included in the room rate, but our ground-floor pastry shop opens early and serves cappuccino, espresso, and fresh pastries — five steps from the lobby."
      - q: "Are sunbeds included?"
        a: "Sunbeds and umbrellas at the beach are not included in the room rate. They're rented directly at the beach for the day."
      - q: "Where do I park?"
        a: "Free public street parking in front of the hotel. We will try to reserve a space for you if we can — first-come, first-served."
      - q: "What payment methods do you accept?"
        a: "We accept cash, Visa, Mastercard, Apple Pay, and Google Pay — at the front desk on arrival."
      - q: "Do you allow pets?"
        a: "Pets are not allowed at Vila Emes."
      - q: "Are cribs or extra beds available?"
        a: "Cribs are not available. An extra bed can be added to most rooms for €5 per person, per night — let us know in advance."
      - q: "What languages do you speak?"
        a: "English, Italian, and Albanian — every day, all day."
    footer_cta_handwritten: "Don't see your question? Write to us →"
  ready_cta:
    handwritten: "— still deciding?"
    heading: "Book your stay at Vila Emes"
    sub: "Pick your dates on Booking.com or find us on the map."
    wa_text: "Hello, I'd like to book at Vila Emes"
    book_label: "Book on Booking.com"
    map_label: "Open the map"

